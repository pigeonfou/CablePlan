# Bind to the LAN interface using CABLEPLAN_LAN_IP during installation.
# Do not port-forward the LAN listener from the WAN.
server {
    listen __LAN_IP__:80;
    server_name _;
    client_max_body_size 8m;
    location / {
        proxy_pass http://unix:/run/cableplan/app.sock;
        proxy_set_header Host $host;
        proxy_set_header X-CablePlan-Access-Channel lan;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
    }
}
server {
    listen 127.0.0.1:8081;
    server_name _;
    client_max_body_size 8m;
    location / {
        proxy_pass http://unix:/run/cableplan/app.sock;
        proxy_set_header Host $host;
        proxy_set_header X-CablePlan-Access-Channel tunnel;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare public hostname must enforce HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
    }
}
