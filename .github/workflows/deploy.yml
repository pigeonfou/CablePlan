name: Deploy
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cableplan-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, x64, cableplan]
    environment: production
    steps:
      - name: Deploy tested main commit
        env:
          CABLEPLAN_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: sudo /usr/local/sbin/cableplan-deploy "$CABLEPLAN_TARGET_SHA"
