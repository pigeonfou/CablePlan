[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cableplan"
version = "0.1.0"
description = "Conception locale de plans de câblage"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "reportlab==4.4.9", "argon2-cffi==25.1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
cableplan = "app.cli:main"

[tool.setuptools.package-data]
app = ["static/*", "migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
